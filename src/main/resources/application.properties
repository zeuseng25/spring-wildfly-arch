spring.application.name=spring-wildfly-arch

# --- Aktif profil ---
# wildfly: WAR olarak WildFly'a deploy (JNDI datasource) — VARSAYILAN.
# local  : lokal embedded Tomcat (doğrudan JDBC). Çalıştırırken: -Dspring.profiles.active=local
spring.profiles.active=wildfly

# --- Veri erişim implementasyonu: jdbc (SimpleJdbcCall, varsayılan) | jpa (StoredProcedureQuery) ---
# Her iki yol da Oracle PRODUCT_PKG stored procedure'lerini çağırır. JpaRepository KULLANILMAZ.
app.repository.impl=jdbc

# NOT: Datasource'lar (OracleDS/ReportingDS) TAMAMEN zeus-database tarafından yönetilir; burada
# datasource ile ilgili hiçbir ayar yoktur. App: StoredProcedureExecutors inject → sp.getOracleDs().

# --- AI (zeus-ai / Spring AI 2.x) ---
# Model sağlayıcı OpenAI-UYUMLU bir endpoint'tir. Kod her üç hedefte de aynıdır;
# yalnızca aşağıdaki üç değer değişir:
#   PROD   : vLLM        -> AI_BASE_URL=http://vllm.kurum.local:8000/v1
#   ARA    : LiteLLM     -> AI_BASE_URL=http://litellm.kurum.local:4000/v1
#   GELİŞT.: OpenRouter  -> AI_BASE_URL=https://openrouter.ai/api/v1  (varsayılan)
# Anahtar ASLA repoya yazılmaz; ortam değişkeninden okunur.
spring.ai.openai.base-url=${AI_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.api-key=${AI_API_KEY:degistir}
# Model: açık ağırlıklı Qwen3-30B-A3B-Instruct — OpenRouter'da bu slug, vLLM'de
# "Qwen/Qwen3-30B-A3B-Instruct-2507" olarak aynı model host edilir (tool calling destekli).
spring.ai.openai.chat.model=${AI_MODEL:qwen/qwen3-30b-a3b-instruct-2507}
spring.ai.openai.chat.temperature=0.3

# Ortak sistem promptu ve konuşma logu framework'ten (zeus.ai.*) yönetilir.
zeus.ai.log-conversation=false

# --- JPA / Hibernate (her iki profilde ortak — hedef Oracle) ---
# Dialect otomatik algılanır (Hibernate 7, bağlantı metadata'sından); açıkça yazılmaz.
# Şema manuel yönetiliyor (db/schema.sql), Hibernate DDL üretmesin:
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DataSource yönetimi UYGULAMADA DEĞİL, zeus-database'dedir (OracleDS/ReportingDS).
# App yalnız StoredProcedureExecutors inject edip sp.getOracleDs()/sp.getReportDs() çağırır.
# Ortam (WildFly JNDI vs lokal) otomatik algılanır (OnZeusJndiCondition).
#   - wildfly profili: JNDI datasource'lar (framework varsayılan adları)
#   - local profili  : application-local.properties'teki doğrudan JDBC (lokal geliştirme)
