# profil: local — lokal embedded Tomcat (IntelliJ Run / mvn spring-boot:run)
# JNDI yok; doğrudan JDBC ile Docker'daki Oracle'a bağlanır.
# Çalıştırma: -Dspring.profiles.active=local  (ojdbc provided scope ile classpath'te)

# Sabit port: WildFly (8080) ile çakışmasın
server.port=2525
# Context path: WildFly ile aynı olsun (WildFly'da WAR adından /spring-wildfly-arch geliyor)
server.servlet.context-path=/spring-wildfly-arch

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=ABC
spring.datasource.password=ABC
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP havuzu (lokal)
spring.datasource.hikari.maximum-pool-size=5
