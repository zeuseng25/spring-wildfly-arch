# profil: wildfly — WAR olarak WildFly'a deploy edildiğinde (varsayılan)
#
# DATASOURCE YOK: OracleDS/ReportingDS JNDI datasource'ları TAMAMEN zeus-database tarafından
# yönetilir (JNDI adları framework'te varsayılan). App bunları bilmez/yazmaz; JNDI'nın varlığı
# otomatik algılanır (OnZeusJndiCondition). App yalnız StoredProcedureExecutors inject edip
# sp.getOracleDs() / sp.getReportDs() çağırır.

# JTA: işlemleri WildFly'ın transaction manager'ına bırak (JNDI datasource ile uyumlu)
spring.jpa.properties.hibernate.transaction.coordinator_class=jta
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.JBossAppServerJtaPlatform
