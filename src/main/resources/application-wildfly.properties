# profil: wildfly — WAR olarak WildFly'a deploy edildiğinde (varsayılan)
#
# DATASOURCE YOK: OracleDS/ReportingDS JNDI datasource'ları TAMAMEN zeus-database tarafından
# yönetilir (JNDI adları framework'te varsayılan). App bunları bilmez/yazmaz; JNDI'nın varlığı
# otomatik algılanır (OnZeusJndiCondition). App yalnız StoredProcedureExecutors inject edip
# sp.getOracleDs() / sp.getReportDs() çağırır.

# JTA: Hibernate 7 + WildFly'da JTA platformu OTOMATİK algılanır; Boot 3.1 dönemindeki
# coordinator_class/jta.platform property'leri kaldırıldı (Boot 4 / WildFly 41 yükseltmesi).
# Sorun çıkarsa geri dönüş merdiveni (bkz. gelistirmeler/16-java25-boot4-wildfly41-yukseltme.md):
#   spring.jpa.properties.hibernate.transaction.jta.platform=JBossAS

# SMS SOAP endpoint'i (demo). Bilinçli olarak yalnızca bu profilde: 'local' profilde bu satır
# yok, dolayısıyla ZeusSmsClient bean'i orada hiç kurulmaz (SmsDemoController bunu
# ObjectProvider ile tembel çözüp bean yoksa 503 döner; context açılışı etkilenmez).
zeus.sms.endpoint=http://127.0.0.1:18080/sms
