# Test profili: WildFly/JNDI yokken context yüklenebilsin diye gömülü H2 kullanılır.
# Üretim ayarları (JNDI + Oracle) src/main/resources/application.properties içindedir.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Yetenek opt-in'i: test classpath'inde src/test/resources/application.properties, main'deki
# aynı adlı dosyayı GÖLGELER — bu yüzden yetenekler burada da açıkça bildirilir.
zeus.database.enabled=true
zeus.ai.enabled=true

# Dialect otomatik algılanır (Hibernate 7); açıkça yazmaya gerek yok.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# AI: context yüklenirken model çağrısı YAPILMAZ, ama Spring AI auto-config boş anahtarla
# ayağa kalkmaz. Sahte anahtar + erişilemez base-url verilir; testte gerçek çağrı yoktur.
spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://localhost:1/v1
