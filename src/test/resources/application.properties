# Test profili: WildFly/JNDI yokken context yüklenebilsin diye gömülü H2 kullanılır.
# Üretim ayarları (JNDI + Oracle) src/main/resources/application.properties içindedir.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialect otomatik algılanır (Hibernate 7); açıkça yazmaya gerek yok.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
